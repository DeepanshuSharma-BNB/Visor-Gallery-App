<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="description" content="Visor Gallery, distraction-free photos for Meta Ray-Ban Display">
<title>Visor Gallery · Glasses</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css?v=photo3">
</head>
<body class="glass-body">
<main class="glass-viewer" id="glass" aria-label="Visor photo viewer">
  <img id="photo" class="glass-image" alt="Selected photo" draggable="false">
  <section id="pair-screen" class="glass-message" aria-live="polite">
    <span class="glass-symbol">◈</span>
    <p class="glass-eyebrow">VISOR GALLERY · CONNECT</p>
    <div class="pair-code" id="code">···· ···· ····</div>
    <p>Enter this code in the phone or computer gallery controller.</p>
    <p id="glass-status" class="glass-secondary">Connecting…</p>
  </section>
  <section id="waiting" class="glass-message hidden" aria-live="polite">
    <span class="glass-symbol">◈</span>
    <p class="glass-eyebrow">VISOR GALLERY</p>
    <p>Connected. Select a photo on your phone or computer.</p>
  </section>
  <p id="notice" class="glass-notice hidden" role="status" aria-live="polite"></p>
</main>
<script src="common.js?v=photo3"></script>
<script src="glasses.js?v=photo3"></script>
</body>
</html>
